name: Release notes from the changelog
description: >-
  Sets the published release's notes to its version's section of
  CHANGELOG.md, replacing any written on the release, so the changelog is the
  one source.

# The caller checks out the repo first, so the changelog is there, and grants
# `contents: write` to edit the release.
inputs:
  version:
    description: The version whose section to use, e.g. 1.2.0.
    required: true

runs:
  using: composite
  steps:
    - name: Read the version's changelog section
      id: changelog
      # it fails when the changelog has no section for the version, which
      # should leave the notes as they are, not stop the release
      continue-on-error: true
      uses: mindsers/changelog-reader-action@v2.4.0
      with:
        path: CHANGELOG.md
        version: ${{ inputs.version }}
        version_scheme: pep440

    - name: Fill in the release notes
      if: steps.changelog.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
        NOTES_FILE: ${{ steps.changelog.outputs.changes_file }}
      run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE"
