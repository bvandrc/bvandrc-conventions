name: Check

# Validates the shared Biome config before it can sync anywhere. The root
# biome.json extends conventions/biome.base.jsonc, so Biome parses the base as
# part of its config graph — an unknown rule or misspelled key fails here.
# Also builds an example package with the shared PyPI build action, and checks
# the sync-release-notes action reads its changelog, so a change to either
# fails here rather than in another repo's release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Biome check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  pypi-build:
    name: PyPI build action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the example package
        id: build
        uses: ./.github/actions/pypi-build
        with:
          tag: v0.1.0
          working-directory: test/pypi-package

      - name: Check the version it gives
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: test "$VERSION" = 0.1.0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: downloaded

      - name: Check the distributions were uploaded
        run: ls downloaded/*.whl downloaded/*.tar.gz

      - name: Build with a tag that doesn't match the version
        id: wrong-tag
        continue-on-error: true
        uses: ./.github/actions/pypi-build
        with:
          tag: v9.9.9
          working-directory: test/pypi-package
          upload-name-suffix: -wrong-tag

      - name: Check it failed
        if: steps.wrong-tag.outcome != 'failure'
        run: |
          echo "::error::The build should fail when the tag doesn't match the version."
          exit 1

  sync-release-notes:
    name: Sync release notes action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check it reads each version's changelog section
        env:
          ACTION_DIR: .github/actions/sync-release-notes
          CHANGELOG: test/pypi-package/CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.environ["ACTION_DIR"])
          from sync_release_notes import changelog_sections, release_notes

          with open(os.environ["CHANGELOG"], encoding="utf-8") as f:
              sections = changelog_sections(f.read())
          assert sections == {"0.2.0": "- **Feature:** Something new.", "0.1.0": "- First release."}, sections
          notes = release_notes("- New.", "- Old.\r\n\r\nPublished to [PyPI](https://pypi.org).")
          assert notes == "- New.\n\nPublished to [PyPI](https://pypi.org).", notes
          PY

      # this repo has no releases, so it only checks the action runs
      - name: Run it
        uses: ./.github/actions/sync-release-notes
        with:
          changelog: test/pypi-package/CHANGELOG.md
          dry-run: true
