name: Build a PyPI release
description: >-
  Builds and checks the sdist and wheel with
  hynek/build-and-inspect-python-package, uploading them as an artifact for
  the publish job, and checks that the release's tag is "v" + their version.

# The caller checks out the repo first, and publishes from its own workflow
# file: PyPI's trusted publishing matches the workflow that runs
# pypa/gh-action-pypi-publish, so that step can't move in here or into a
# reusable workflow.
inputs:
  tag:
    description: The release's tag. Defaults to the published release's.
    required: false
    default: ${{ github.event.release.tag_name }}
  python-version:
    description: The Python that runs the build.
    required: false
    default: '3.13'
  working-directory:
    description: The folder holding pyproject.toml.
    required: false
    default: .
  upload-name-suffix:
    description: A suffix for the artifact's name, to build more than one package in a workflow.
    required: false
    default: ''

outputs:
  version:
    description: The built package's version, which the tag matched.
    value: ${{ steps.build.outputs.package_version }}
  artifact-name:
    description: The name of the artifact holding the distributions.
    value: ${{ steps.build.outputs.artifact-name }}

runs:
  using: composite
  steps:
    # builds, checks the wheel's contents and the README PyPI will render,
    # and uploads the distributions
    - name: Build and inspect
      id: build
      uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
      with:
        path: ${{ inputs.working-directory }}
        python-version: ${{ inputs.python-version }}
        upload-name-suffix: ${{ inputs.upload-name-suffix }}

    # a tag that doesn't match would publish the release's notes and
    # distributions under the wrong version
    - name: Check the tag matches the version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        VERSION: ${{ steps.build.outputs.package_version }}
      run: |
        if [ "$TAG" != "v$VERSION" ]; then
          echo "::error::The release's tag is $TAG, but the package's version is $VERSION. Its tag must be v$VERSION."
          exit 1
        fi
