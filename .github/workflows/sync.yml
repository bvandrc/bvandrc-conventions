name: Sync Conventions

# Reusable workflow. Consuming repos call this rather than copying the sync
# steps, so a fix here reaches every project on the next run. Callers own the
# triggers and must grant contents/pull-requests write — a called workflow
# cannot widen its own permissions.
on:
  workflow_call:
    inputs:
      files:
        description: >-
          Space-separated convention files to sync, e.g.
          "typescript.md react.md all.md". Names must exist in conventions/
          in this repo; a missing name fails the run.
        required: true
        type: string

env:
  CONVENTIONS_REPO: bvandrc/bvandrc-conventions
  SYNC_MESSAGE: 'chore: sync convention docs from bvandrc-conventions'
  SRC_DIR: .conventions-src
  DEST_DIR: conventions

jobs:
  sync:
    name: Sync conventions
    runs-on: ubuntu-latest

    concurrency:
      group: sync-conventions-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout caller
        uses: actions/checkout@v7

      - name: Checkout conventions
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CONVENTIONS_REPO }}
          path: ${{ env.SRC_DIR }}

      - name: Copy conventions into place
        env:
          FILES: ${{ inputs.files }}
        run: |
          # Delete first so a file dropped from `files`, or retired upstream,
          # disappears downstream instead of lingering.
          rm -rf "$DEST_DIR"
          mkdir -p "$DEST_DIR"
          for file in $FILES; do
            cp "$SRC_DIR/conventions/$file" "$DEST_DIR/$file"
          done
          # Drop the source checkout so it is not swept into the commit.
          rm -rf "$SRC_DIR"

      # A run on the default branch has nowhere safe to commit, so it proposes
      # the sync as a pull request. A manual run on any other branch is someone
      # pulling conventions into work already in progress, so it commits there.
      - name: Decide where the sync lands
        id: target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Empty would silently mean "not the default branch", and push to it.
          test -n "$DEFAULT_BRANCH"
          # Assignments both succeed, so the || arm can't swallow a real failure.
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && in_place=false || in_place=true
          echo "commit-in-place=$in_place" >> "$GITHUB_OUTPUT"

      - name: Commit to the current branch on drift
        if: steps.target.outputs.commit-in-place == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Conventions already up to date on $GITHUB_REF_NAME."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "$DEST_DIR"
          git commit -m "$SYNC_MESSAGE"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Open pull request on drift
        if: steps.target.outputs.commit-in-place == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-convention-docs
          delete-branch: true
          commit-message: ${{ env.SYNC_MESSAGE }}
          title: ${{ env.SYNC_MESSAGE }}
          body: |
            Automated sync from https://github.com/${{ env.CONVENTIONS_REPO }}

            Edit conventions upstream — this directory is overwritten on every
            sync, so changes made here are lost.
