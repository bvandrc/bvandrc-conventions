name: Build a PyPI release
description: >-
  Checks that the release's tag is "v" + pyproject.toml's version, builds the
  sdist and wheel, and uploads them as an artifact for the publish job.

# The caller checks out the repo first, and publishes from its own workflow
# file: PyPI's trusted publishing matches the workflow that runs
# pypa/gh-action-pypi-publish, so that step can't move in here or into a
# reusable workflow. That action also checks the distributions' metadata
# (twine check) before uploading, so this one doesn't.
inputs:
  tag:
    description: The release's tag. Defaults to the published release's.
    required: false
    default: ${{ github.event.release.tag_name }}
  python-version:
    description: The Python that runs the build.
    required: false
    default: '3.13'
  working-directory:
    description: The folder holding pyproject.toml.
    required: false
    default: .
  artifact-name:
    description: The name of the artifact holding the distributions.
    required: false
    default: dist

outputs:
  version:
    description: pyproject.toml's version, which the tag matched.
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # a tag that doesn't match would publish the release's notes and
    # distributions under the wrong version
    - name: Check the tag matches the version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAG: ${{ inputs.tag }}
      run: |
        version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
        if [ "$TAG" != "v$version" ]; then
          echo "::error::The release's tag is $TAG, but pyproject.toml's version is $version. Its tag must be v$version."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Upload the distributions
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/dist/
        if-no-files-found: error
